name: Build APK

# Builds an installable debug APK on GitHub's runners, which ship the Android
# SDK. Avoids needing a laptop — download the artifact and install it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 17 specifically: Gradle 8.5 / Kotlin 1.9.21 cannot parse newer
      # version strings and fail in JavaVersion.parse().
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the SDK with licences accepted. The
      # setup-android action is avoided deliberately: v3 fails accepting
      # licences and v4 tries to install the long-obsolete `tools` package.
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the APK with the commit
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/voiceink-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: voiceink-debug-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error
