name: Build APK

# Builds an installable debug APK on GitHub's runners, which ship the Android
# SDK. Avoids needing a laptop — download the artifact and install it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 17 specifically: Gradle 8.5 / Kotlin 1.9.21 cannot parse newer
      # version strings and fail in JavaVersion.parse().
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the APK with the commit
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/voiceink-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: voiceink-debug-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error
